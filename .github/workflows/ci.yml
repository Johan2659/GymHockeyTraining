# CI/CD iOS -> TestFlight
# Gym Hockey Training - adopted from the D:\Dev template (Speaking Reflexes pipeline).
# Adoption mode: lockfile not enforced, analyzer warnings and tests non-blocking.
# Tighten once the codebase is cleaned up (see docs/RELEASE.md).
#   - PR et main : analyse + tests + build iOS non signé
#   - main uniquement : build signé + upload TestFlight
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.50.1'
  BUNDLE_ID: 'com.johan2659.gymhockeytraining'

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings  # tests excluded: outdated since auth refactor (see docs/RELEASE.md)

      - name: Test (non-blocking during adoption)
        run: flutter test
        continue-on-error: true

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign

  release:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS signing tools (isolated venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-venv"
          source "$RUNNER_TEMP/codemagic-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install codemagic-cli-tools==0.69.0
          echo "$RUNNER_TEMP/codemagic-venv/bin" >> "$GITHUB_PATH"

      - name: Prepare Apple credentials
        run: |
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$IOS_CERTIFICATE_PRIVATE_KEY" > "$RUNNER_TEMP/cert_key"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert_key"

      - name: Initialize temporary keychain
        run: keychain initialize

      - name: Fetch distribution certificate and provisioning profile
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key=@file:"$RUNNER_TEMP/AuthKey.p8" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$RUNNER_TEMP/cert_key" \
            --strict-match-identifier \
            --create

      - name: Add certificate to keychain
        run: keychain add-certificates

      - name: Apply provisioning profile
        run: xcode-project use-profiles

      - name: Install CocoaPods dependencies
        run: find . -name "Podfile" -execdir pod install \;

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-hockey-training-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect / TestFlight
        run: |
          app-store-connect publish \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key=@file:"$RUNNER_TEMP/AuthKey.p8" \
            --path "$(find "$GITHUB_WORKSPACE/build/ios/ipa" -name '*.ipa' -print -quit)"

      - name: Cleanup credentials
        if: always()
        run: |
          keychain use-login || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert_key"
